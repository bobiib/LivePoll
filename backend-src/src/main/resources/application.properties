spring.application.name=livepoll-backend

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:807/live-poll}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:CHANGE_ME}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.docker.compose.enabled=false
spring.session.jdbc.initialize-schema=always

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.mongodb.representation.uuid=standard
spring.data.mongodb.uri=${SPRING_MONGODB_URI:mongodb://admin:CHANGE_ME@localhost:805/polls?authSource=admin}
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://admin:CHANGE_ME@localhost:805/polls?authSource=admin}

jwt.secret=${JWT_SECRET:CHANGE_ME_LOCAL_DEV_JWT_SECRET_MIN_32_CHARS}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

rate-limit.enabled=true
rate-limit.general.capacity=60
rate-limit.general.refill-tokens=60
rate-limit.general.refill-duration=PT1M
rate-limit.auth.capacity=10
rate-limit.auth.refill-tokens=10
rate-limit.auth.refill-duration=PT1M
rate-limit.vote.capacity=30
rate-limit.vote.refill-tokens=30
rate-limit.vote.refill-duration=PT1M
